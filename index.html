<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>FNAF-Style 2D Minigame</title>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      const el = document.createElement('div');
      el.style = 'position: absolute; top: 0; left: 0; background: red; color: white; z-index: 9999; padding: 10px; font-family: monospace; white-space: pre-wrap;';
      el.textContent = 'Error: ' + msg + '\nLine: ' + line + '\n' + (error ? error.stack : '');
      document.body.appendChild(el);
    };
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #menuVideo {
      display: none;
    }
  </style>
  <script src="sprites.js?v=7" defer></script>
  <script src="audio.js?v=5" defer></script>
  <script src="menu.js?v=6" defer></script>
  <script src="entities.js?v=7" defer></script>
  <script src="map.js?v=8" defer></script>
  <script src="interactions.js?v=7" defer></script>
  <script src="inventory.js?v=4" defer></script>
  <script src="minimap.js?v=3" defer></script>
  <script src="health.js?v=3" defer></script>
  <script src="debug.js?v=4" defer></script>
  <script src="game.js?v=12" defer></script>
</head>

<body>
  <video id="menuVideo" src="mp4/menu_static.mp4" muted loop preload="auto"></video>
  <canvas id="gameCanvas"></canvas>
</body>

</html>
