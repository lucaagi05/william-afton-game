<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>FNAF-Style 2D Minigame</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #menuVideo {
      display: none;
    }
  </style>
  <script src="sprites.js?v=3" defer></script>
  <script src="audio.js?v=3" defer></script>
  <script src="menu.js?v=3" defer></script>
  <script src="entities.js?v=3" defer></script>
  <script src="map.js?v=3" defer></script>
  <script src="interactions.js?v=3" defer></script>
  <script src="inventory.js?v=1" defer></script>
  <script src="minimap.js?v=1" defer></script>
  <script src="game.js?v=3" defer></script>
</head>

<body>
  <video id="menuVideo" src="mp4/menu_static.mp4" muted loop preload="auto"></video>
  <canvas id="gameCanvas"></canvas>
</body>

</html>
